# One-command run: `docker compose up --build`. Defaults to the synthetic source, so
# it needs no live venue, account, or paid feed. The dashboard's edge URL fallback
# (web/app/page.tsx) already points at the edge's host-mapped port below, so nothing
# else needs configuring for the default demo.
#
# For live data instead, override the edge's command, e.g.:
#   docker compose run --rm --service-ports edge -http :8080 -live -venue kraken -symbol BTC/USD

services:
  edge:
    build:
      context: .
      dockerfile: Dockerfile
    # -steps defaults to 5000 at the default pace (150ms), which exhausts the
    # synthetic source and exits after about 12.5 minutes - fine for the test suite,
    # not for a demo meant to stay up while a reviewer browses the dashboard. A large
    # step count keeps it running for a full session (100,000,000 steps at 150ms is
    # over 170 days, effectively indefinite); it still exits cleanly (never wedges)
    # once exhausted.
    #
    # To show the engine healing itself, add "-chaos": the synthetic source then injects a gap, a
    # reorder, a duplicate, a disconnect, a crossing delta and a coalesced delta in every 300 steps.
    # The recoveries show in /metrics and /api/status; the dashboard does not display them yet.
    command: ["-http", ":8080", "-steps", "100000000"]
    # A fatal exit (for example a venue that stays down past the snapshot retries) is
    # retried a few times; on-failure also caps a bad-flag exit, which unless-stopped would loop on.
    restart: on-failure:5
    ports:
      - "8080:8080"

  dashboard:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Inlined into the page at build time, and the one origin its Content-Security-Policy lets it call.
        NEXT_PUBLIC_EDGE_URL: ${NEXT_PUBLIC_EDGE_URL:-http://127.0.0.1:8080}
    ports:
      - "3000:8080"
    # nginx writes only under /tmp (see web/nginx.conf), so the rest of the container can be read-only.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - edge
