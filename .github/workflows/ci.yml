name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces the older run. Every push to main keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Go matches the toolchain line in go.mod
        run: |
          want="$(awk '$1 == "toolchain" {print $2}' go.mod)"
          got="$(go env GOVERSION)"
          if [ "$got" != "$want" ]; then
            echo "go is $got but go.mod asks for $want"; exit 1
          fi

      - name: pins and versions
        run: |
          sh scripts/check-pins_test.sh
          sh scripts/check-pins.sh .github/workflows/*.yml
          sh scripts/check-versions.sh

      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-clean:"; echo "$unformatted"; exit 1
          fi

      - name: no floating point on the book path
        run: |
          # ADR-0003: no float on the book path — the model, engine, delivery, and the
          # adapter normalization (venue subpackages). Latency stats (internal/metrics)
          # and the WebSocket transport timing (internal/venue/*.go) may use float.
          paths="internal/book internal/market internal/source internal/delivery"
          for d in internal/venue/*/; do [ -d "$d" ] && paths="$paths $d"; done
          scan=""
          for p in $paths; do [ -e "$p" ] && scan="$scan $p"; done
          if [ -n "$scan" ] && grep -rnE --include='*.go' 'float64|float32|ParseFloat' $scan; then
            echo "floating point is forbidden on the book path (ADR-0003)"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          staticcheck ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: build
        run: go build ./...

      # -count=1: a cached result would replay an old shuffle seed. The seed is printed; a failure can be
      # repeated with -shuffle=<seed>.
      - name: test (race, shuffled, with coverage)
        run: go test -race -shuffle=on -count=1 -timeout 7m -coverprofile=coverage.out ./...

      - name: coverage per package
        run: |
          sh scripts/check-coverage_test.sh
          go list ./... > packages.txt
          sh scripts/check-coverage.sh coverage.out packages.txt .github/coverage-min.txt "$(go list -m)"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pnpm version is the packageManager field of web/package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: install
        run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm lint

      - name: type-check
        run: pnpm type-check

      - name: format
        run: pnpm format:check

      - name: test (with coverage)
        run: pnpm test:coverage

      - name: script tests
        run: pnpm test:scripts

      - name: build
        run: pnpm build

      # Runs the pinned nginx image as the unprivileged user on a read-only file system, with the
      # exported pages and the rendered headers, and checks what is served.
      - name: image check
        run: sh scripts/check-image.sh

  # The whole stack from a browser: a real edge (synthetic source, faults injected), the built dashboard behind the real nginx
  # image and its policy, opened in Chrome. SHIFT_LIMIT is the layout shift allowed while the book updates; the target is
  # 0.001 and it is lowered to that as the old parts of the page are replaced.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: build the dashboard
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: open it in Chrome
        working-directory: web
        env:
          CHROME_BIN: /usr/bin/google-chrome
          SHIFT_LIMIT: '0.05'
          BROWSER_CHECK_OUT: ${{ runner.temp }}/browser-check
        run: sh scripts/check-stack.sh

      - name: keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-check
          path: ${{ runner.temp }}/browser-check
          if-no-files-found: ignore

  # Live-venue tests hit real exchange endpoints, so they run only on demand — a venue
  # outage or rate limit must never block a merge. Not in the required-checks set.
  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: live venue integration tests
        run: go test -tags integration ./internal/venue/...
