# Weekly update PRs, minor and patch changes grouped, never merged automatically.
# The Go version and the Node major are not updated here: they are bumped by hand together with go.mod's
# toolchain line and web/package.json's engines (scripts/check-versions.sh fails when they differ).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The runtime is Node 22 (web/package.json engines), so its type definitions stay on 22.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      web-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/, /web, /bench]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: golang
      # Node moves with the even-numbered LTS lines, by hand, together with engines and the drift check.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      images-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
