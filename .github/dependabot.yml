# Weekly update PRs, minor and patch changes grouped, never merged automatically.
# The Go version is not updated here: it is bumped by hand together with the toolchain line in go.mod
# (scripts/check-versions.sh fails when the two differ).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/, /web]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: golang
    groups:
      images-minor-patch:
        update-types: [minor, patch]
