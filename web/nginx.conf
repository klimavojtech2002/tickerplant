# Runs as the unprivileged user "nginx" on port 8080: every path nginx writes to is under /tmp and
# the logs go to the container's stdout and stderr. There is no `user` line (it only warns when not
# root) and no conf.d include (the stock default.conf listens on port 80).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css text/plain text/javascript application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/security-headers.conf;

        error_page 404 /404.html;

        location = /404.html {
            internal;
            include /etc/nginx/security-headers.conf;
        }

        # File names under /_next/static carry a content hash, so a cached copy is never stale.
        location /_next/static/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # The pages name the hashed files; they must be fetched again to pick up a new build.
        location / {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri.html $uri/ =404;
        }
    }
}
